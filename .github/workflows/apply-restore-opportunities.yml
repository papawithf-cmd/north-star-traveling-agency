name: Apply and verify original opportunities

on:
  workflow_dispatch:
  push:
    paths:
      - supabase/migrations/20260927153000_restore_original_northstar_opportunities.sql

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Validate Supabase credentials
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing GitHub secret: SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Link to the Vercel application's Supabase project
        run: |
          set -euo pipefail
          PROJECT_REF="$(grep '^SUPABASE_PROJECT_ID=' .env | cut -d= -f2- | tr -d '"')"
          test -n "$PROJECT_REF"
          echo "Using Supabase project ref: $PROJECT_REF"
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Dry-run and require only the requested migration
        run: |
          set -euo pipefail
          supabase db push --dry-run 2>&1 | tee /tmp/supabase-dry-run.txt
          grep -q "20260927153000_restore_original_northstar_opportunities.sql" /tmp/supabase-dry-run.txt
          OTHER="$(grep -E "Applying migration|Applying.*migration|202[0-9]{14}_" /tmp/supabase-dry-run.txt | grep -v "20260927153000_restore_original_northstar_opportunities.sql" || true)"
          if [ -n "$OTHER" ]; then
            echo "Unexpected pending migrations detected; refusing to apply anything."
            echo "$OTHER"
            exit 1
          fi

      - name: Apply requested migration
        run: |
          set -euo pipefail
          supabase db push

      - name: Verify restored database records
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="$(grep '^SUPABASE_URL=' .env | cut -d= -f2- | tr -d '"')"
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            SUPABASE_PUBLISHABLE_KEY="$(grep '^SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2- | tr -d '"')"
          fi

          curl -fsSL             -H "apikey: $SUPABASE_PUBLISHABLE_KEY"             -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY"             "$SUPABASE_URL/rest/v1/opportunities?select=slug,status&slug=in.(northstar-emirates-cabin-crew,northstar-emirates-cabin-services-assistant,northstar-emirates-engineering-projects-officer,northstar-emirates-security-coordinator,northstar-etihad-cabin-crew,northstar-amazon-fulfilment-associate,northstar-amazon-inbound-specialist,northstar-dhl-warehouse-operative,northstar-marriott-hotel-cleanliness-expert,northstar-marriott-banquet-intern-dubai,northstar-g4s-security-officer,northstar-pcl-project-coordinator-fort-mcmurray,northstar-aramco-experienced-engineer,northstar-barchester-care-assistant-manchester,northstar-stagecoach-bus-driver-manchester,cabin-crew-international-routes,live-in-caregiver)"             > /tmp/restored.json

          COUNT="$(jq 'length' /tmp/restored.json)"
          test "$COUNT" -eq 17 || { echo "Expected 17 restored opportunities, got $COUNT"; cat /tmp/restored.json; exit 1; }
          jq -e 'all(.[]; .status == "published")' /tmp/restored.json

      - name: Browser-test the live Opportunities page
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });

            const titles = [
              ["Cabin Crew Opportunities", "northstar-emirates-cabin-crew"],
              ["Cabin Services Assistant", "northstar-emirates-cabin-services-assistant"],
              ["Fulfilment Associate", "northstar-amazon-fulfilment-associate"],
            ];

            await page.goto("https://north-star-traveling-agency.vercel.app/opportunities", {
              waitUntil: "networkidle",
              timeout: 60000,
            });

            for (const [title, slug] of titles) {
              await page.locator(`a[href="/opportunities/${slug}"]`).first().waitFor({ state: "visible", timeout: 30000 });
              const visible = await page.getByText(title, { exact: true }).first().isVisible();
              if (!visible) throw new Error(`Missing restored opportunity on public page: ${title}`);
            }

            for (const [title, slug] of titles) {
              await page.goto("https://north-star-traveling-agency.vercel.app/opportunities", {
                waitUntil: "networkidle",
                timeout: 60000,
              });
              await page.locator(`a[href="/opportunities/${slug}"]`).first().click();
              await page.waitForLoadState("networkidle");
              const url = page.url();
              if (!url.endsWith(`/opportunities/${slug}`)) {
                throw new Error(`Did not open detail page for ${title}: ${url}`);
              }
              const h1 = await page.locator("h1").first().textContent();
              if (!h1 || !h1.includes(title)) {
                throw new Error(`Detail page heading mismatch for ${title}: ${h1}`);
              }
            }

            await page.goto("https://north-star-traveling-agency.vercel.app/opportunities", {
              waitUntil: "networkidle",
              timeout: 60000,
            });
            await page.reload({ waitUntil: "networkidle", timeout: 60000 });

            for (const [title, slug] of titles) {
              await page.locator(`a[href="/opportunities/${slug}"]`).first().waitFor({ state: "visible", timeout: 30000 });
              if (!(await page.getByText(title, { exact: true }).first().isVisible())) {
                throw new Error(`Restored opportunity disappeared after refresh: ${title}`);
              }
            }

            console.log("LIVE BROWSER TEST PASSED: listings visible, detail pages open, refresh retains listings.");
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
