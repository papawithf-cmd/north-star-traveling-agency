name: Run production opportunity restore

on:
  push:
    paths:
      - src/routes/api/restore-opportunities.ts

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel and execute restore endpoint
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            echo "Attempt $attempt"
            if response="$(curl -fsS https://north-star-traveling-agency.vercel.app/api/restore-opportunities)"; then
              echo "$response"
              echo "$response" | grep -q '"ok":true'
              exit 0
            fi
            sleep 10
          done
          echo "Production restore endpoint did not succeed."
          exit 1
